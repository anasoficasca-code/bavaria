name: Publish Bavaria
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < app.js
      - uses: actions/configure-pages@v5
      - name: Prepare only public website files
        run: |
          mkdir -p public/data
          cp index.html style.css app.js icon.svg .nojekyll public/
          cp data/*.json public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
